name: Package release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Package portable Python source
        run: |
          ROOT=dist/MobiGo2HomebrewManager-Python
          mkdir -p "$ROOT"
          cp -R mobigo_homebrew_manager assets "$ROOT/"
          cp mobigo_manager.py requirements.txt pyproject.toml README.md LICENSE "$ROOT/"
          cd dist
          zip -r ../MobiGo2HomebrewManager-Python.zip MobiGo2HomebrewManager-Python
      - uses: actions/upload-artifact@v4
        with:
          name: MobiGo2HomebrewManager-Python
          path: MobiGo2HomebrewManager-Python.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: MobiGo2HomebrewManager-Python.zip
